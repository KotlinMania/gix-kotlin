[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
vanniktech = "0.37.0"
detekt = "1.23.8"
ktlint = "14.2.0"
kotlinxBenchmark = "0.5.0"
thiserror = "0.2.0"
regex = "0.1.0"
serde = "0.1.10"
anyhow = "0.1.1"
prettyAssertions = "0.1.0"
serialTest = "0.1.0"
kmIo = "0.1.5"
sha1 = "0.1.2"
sha2 = "0.1.0"
bitflags = "0.1.1"
tempfile = "0.1.0"
tracing = "0.1.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
vanniktech = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
thiserror-kotlin = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
regex-kotlin = { module = "io.github.kotlinmania:regex-kotlin", version.ref = "regex" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
anyhow-kotlin = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
pretty-assertions-kotlin = { module = "io.github.kotlinmania:pretty-assertions-kotlin", version.ref = "prettyAssertions" }
serial-test-kotlin = { module = "io.github.kotlinmania:serial-test-kotlin", version.ref = "serialTest" }
km-io = { module = "io.github.kotlinmania:km-io", version.ref = "kmIo" }
sha1-kotlin = { module = "io.github.kotlinmania:sha1-kotlin", version.ref = "sha1" }
sha2-kotlin = { module = "io.github.kotlinmania:sha2-kotlin", version.ref = "sha2" }
bitflags-kotlin = { module = "io.github.kotlinmania:bitflags-kotlin", version.ref = "bitflags" }
tempfile-kotlin = { module = "io.github.kotlinmania:tempfile-kotlin", version.ref = "tempfile" }

[bundles]
gix-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "thiserror-kotlin",
  "regex-kotlin",
  "serde-kotlin",
  "km-io",
  "sha1-kotlin",
  "sha2-kotlin",
  "bitflags-kotlin",
  "tempfile-kotlin",
]
gix-commonTest = [
  "anyhow-kotlin",
  "pretty-assertions-kotlin",
  "serial-test-kotlin",
]
